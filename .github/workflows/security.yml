name: Security

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  schedule:
    # Nightly scan at 02:15 UTC — keeps a rolling history in the repository.
    - cron: "15 2 * * *"
  workflow_dispatch:

# Cancel superseded runs on the same PR.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Security scan and access-control tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      HAS_DB_SECRETS: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Dependency audit
        # Deferred: Zod 3 must move to 4.6.6+, a major migration.
        # Temporary (added 17 Nov 2026): picomatch ReDoS GHSA-fc5q-39xc-vjpf has no patched
        # release yet (latest is 4.0.7). Build-time only, fixed patterns. Remove this ignore and
        # pin the patched version as soon as it is published.
        # No other advisory is exempt.
        run: bun audit --prod --ignore=GHSA-mrhx-c7xc-m3w5 --ignore=GHSA-fc5q-39xc-vjpf

      - name: Authentication and coverage regression tests
        run: bun run test:deployment

      - name: Build
        run: bun run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install requests

      # Fails the job — and therefore blocks the merge — when the database
      # security suites report a finding that is not in the reviewed baseline.
      # On the nightly run it also appends a snapshot to the rolling history.
      - name: Security regression scan
        if: env.HAS_DB_SECRETS == 'true'
        id: scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCAN_SOURCE: ${{ github.event_name }}
        run: |
          node scripts/security-ci.mjs \
            --json-out security-summary.json \
            ${{ github.event_name == 'schedule' && '--history' || '' }}

      # Behavioural checks: an anonymous / non-admin caller must not reach
      # privileged functions, and public views must stay published-only.
      - name: Access-control tests
        if: env.HAS_DB_SECRETS == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Public (publishable) key of the production project; it ships to every browser, so
          # it is not a secret. A SUPABASE_ANON_KEY repository secret still takes precedence.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_o7x5SdbMTma5ckz-leTLmQ_Gv6-46R1' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 tests/regression/access_control.py

      - name: Summarise live database checks
        if: always()
        run: |
          if [ "$HAS_DB_SECRETS" = "true" ]; then
            echo "GitHub live-database security checks were enabled for this run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Live database security scan skipped: SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY not configured"
            echo "Live database security scan skipped: SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY not configured." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "The existing daily database scan cron inside the backend remains the source of truth for live-database checks." >> "$GITHUB_STEP_SUMMARY"

      # Rate limiting must actually block bursts on the public endpoints.
      - name: Rate-limit tests
        if: env.APP_URL != ''
        env:
          APP_URL: ${{ secrets.APP_URL }}
          BASE_URL: ${{ secrets.APP_URL }}
        run: python3 tests/regression/rate_limits.py

      - name: Commit rolling security history
        if: always() && github.event_name == 'schedule' && env.HAS_DB_SECRETS == 'true'
        run: |
          if [ -n "$(git status --porcelain tests/regression/history)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add tests/regression/history
            git commit -m "chore(security): nightly scan snapshot"
            git push
          else
            echo "No history change."
          fi

      # Alert on any failure above: new findings, failed tests, or a broken job.
      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SECURITY_SLACK_WEBHOOK_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          SECURITY_SCAN_TOKEN: ${{ secrets.SECURITY_SCAN_TOKEN }}
          SCAN_SUMMARY_FILE: security-summary.json
          ALERT_REASON: >-
            security job failed on ${{ github.event_name }} (${{ github.ref_name }})
        run: node scripts/notify-security.mjs
