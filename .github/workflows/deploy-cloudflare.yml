name: Deploy to Cloudflare Pages

# Builds the site in GitHub and uploads it to the Cloudflare Pages project
# "tradesmanfinder" in the Local ServicesPro Ltd Cloudflare account.
#
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   - token with Account > Cloudflare Pages > Edit
#   CLOUDFLARE_ACCOUNT_ID  - the Local ServicesPro Ltd account ID
# Without them the job is skipped with a warning.
#
# Server-side settings (Supabase service key, Resend, Gemini) live in the
# Pages project's own settings, not here. Only public build-time values are set below.

on:
  workflow_dispatch:
  push:
    branches: [production]

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip when Cloudflare secrets are missing
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured; nothing deployed."
          echo "Cloudflare deploy skipped: secrets not configured." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'production' || github.sha }}

      - uses: oven-sh/setup-bun@v2
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          bun-version: latest

      - name: Install
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: bun install

      - name: Build
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          # Same as a Cloudflare Pages Git build: stops Nitro writing a wrangler
          # config that would override the project's dashboard settings.
          CF_PAGES: "1"
          CF_PAGES_BRANCH: production
          VITE_SUPABASE_URL: https://fzijsbkoiuhvjfmuvbrl.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_o7x5SdbMTma5ckz-leTLmQ_Gv6-46R1
          SUPABASE_URL: https://fzijsbkoiuhvjfmuvbrl.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_o7x5SdbMTma5ckz-leTLmQ_Gv6-46R1
          PUBLIC_SITE_URL: https://tradesmanfinder.org
        run: bun run build

      - name: Upload to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          bunx wrangler@4 pages deploy dist \
            --project-name=tradesmanfinder \
            --branch=production \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="$(git log -1 --pretty=%s | head -c 300)" \
            --commit-dirty=true
          echo "Deployed $(git rev-parse --short HEAD) to tradesmanfinder (production)." >> "$GITHUB_STEP_SUMMARY"
